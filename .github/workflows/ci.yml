name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

# Every job runs on the safewords org's self-hosted runners
# (`safewords-runners`), pull requests from forks included: an outside
# contributor's workflow runs only once a maintainer approves it. CI is
# x86-64 Linux only. No Windows, macOS or arm64 jobs: the code stays
# portable, and the NEON (aarch64) paths are checked by hand on ARM hardware
# (README, "NEON on ARM hardware").

# id-token: a push to develop or main shows the compile cache's broker its
# OIDC token to be allowed to write the cache (ci-cache-setup).
permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The SIMD kernels (src/dsp) are checked bit-exact against the scalar
      # ones: SSE4.1 and AVX2 on x86-64 (NEON is checked by hand on ARM
      # hardware, see the README).
      # PRORES_REQUIRE_SIMD makes a missing level a failure, not a skipped
      # comparison; PRORES_FORCE_SCALAR runs everything else on the scalar
      # kernels too.
      matrix:
        include:
          - { name: linux x86-64 (SSE4.1/AVX2), os: safewords-runners }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - name: Build (lib, examples, benchmarks)
        run: cargo build --release --examples --features bench
      - name: Tests (SIMD)
        run: cargo test --release
        env:
          PRORES_REQUIRE_SIMD: "1"
      - name: Tests (scalar kernels forced)
        run: cargo test --release
        env:
          PRORES_FORCE_SCALAR: "1"
      - name: Property tests with overflow checks (debug)
        run: cargo test --test fuzz
      - name: Unit tests with overflow checks (debug)
        run: cargo test --lib

  # The decoder on frames Apple's encoder wrote: the first 4 MB of a public
  # sample (eleven whole frames), fetched here rather than committed. The
  # test skips without PRORES_SAMPLE, so this job is what makes it run.
  sample:
    name: Apple-encoded sample
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - name: Fetch the sample's first 4 MB
        run: >
          curl -fsSL -r 0-4194303 -o "$RUNNER_TEMP/prores-sample.mov"
          https://probelibrary.s3.amazonaws.com/samples/V-codecs/HCPA/AppleProRes422.mov
      - name: Tests
        run: cargo test --release --test sample -- --nocapture
        env:
          PRORES_SAMPLE: ${{ runner.temp }}/prores-sample.mov
      - name: Tests (scalar kernels forced)
        run: cargo test --release --test sample -- --nocapture
        env:
          PRORES_SAMPLE: ${{ runner.temp }}/prores-sample.mov
          PRORES_FORCE_SCALAR: "1"
      # The decoded pictures must not depend on the SIMD level or the
      # thread count: one hash for all four.
      - name: Same pictures at every SIMD level and thread count
        run: |
          cargo build --release --example prores_bench
          b=target/release/examples/prores_bench
          s="$RUNNER_TEMP/prores-sample.mov"
          {
            $b file "$s" 1
            $b file "$s" 0
            PRORES_FORCE_SCALAR=1 $b file "$s" 1
            PRORES_FORCE_SCALAR=1 $b file "$s" 0
          } | tee hashes.txt
          test "$(cut -d' ' -f5 hashes.txt | sort -u | wc -l)" = 1

  msrv:
    name: MSRV (1.99)
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - run: cargo build --release

  lint:
    name: clippy and rustdoc
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # rivet's compile cache, warmed with this commit before rivet's submodule is
  # bumped to it: the commit built inside rivet exactly as rivet's CI builds
  # it (safewords/rivet-transcoder .github/workflows/codec-cache-warmup.yml).
  # Never fails this workflow.
  rivet-cache:
    name: warm rivet's compile cache
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    uses: safewords/rivet-transcoder/.github/workflows/codec-cache-warmup.yml@develop
    with:
      crates: rivet-prores
      submodule: crates/prores
