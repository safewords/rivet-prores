name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

# Every job runs on the safewords org's self-hosted runners
# (`safewords-runners`), pull requests from forks included: an outside
# contributor's workflow runs only once a maintainer approves it. arm64 is
# covered on the same x86-64 runners: cross-compiled for
# aarch64-unknown-linux-gnu and run under QEMU's user-mode emulator, so the
# NEON kernels are still checked against the scalar ones. No Windows or macOS
# CI: the code stays portable, but nothing here tests it there.

jobs:
  test:
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The SIMD kernels (src/dsp) are checked bit-exact against the scalar
      # ones on every host: SSE4.1 and AVX2 on x86-64, NEON on arm64.
      # PRORES_REQUIRE_SIMD makes a missing level a failure, not a skipped
      # comparison; PRORES_FORCE_SCALAR runs everything else on the scalar
      # kernels too.
      matrix:
        include:
          - { name: linux x86-64 (SSE4.1/AVX2), os: safewords-runners }
          - { name: linux arm64 (NEON) under QEMU,         os: safewords-runners, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: aarch64 cross toolchain and QEMU
        # The arm64 entry: cargo builds for aarch64-unknown-linux-gnu and runs
        # every test binary under qemu-aarch64. The runner image has these;
        # the install is a fallback for an image that predates them.
        if: matrix.target
        run: |
          if ! command -v qemu-aarch64 >/dev/null || ! command -v aarch64-linux-gnu-gcc >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
          fi
          {
            echo "CARGO_BUILD_TARGET=${{ matrix.target }}"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER=qemu-aarch64 -L /usr/aarch64-linux-gnu"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Build (lib, examples, benchmarks)
        run: cargo build --release --examples --features bench
      - name: Tests (SIMD)
        run: cargo test --release
        env:
          PRORES_REQUIRE_SIMD: "1"
      - name: Tests (scalar kernels forced)
        run: cargo test --release
        env:
          PRORES_FORCE_SCALAR: "1"
      - name: Property tests with overflow checks (debug)
        run: cargo test --test fuzz
      - name: Unit tests with overflow checks (debug)
        run: cargo test --lib

  # The decoder on frames Apple's encoder wrote: the first 4 MB of a public
  # sample (eleven whole frames), fetched here rather than committed. The
  # test skips without PRORES_SAMPLE, so this job is what makes it run.
  sample:
    name: Apple-encoded sample
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the sample's first 4 MB
        run: >
          curl -fsSL -r 0-4194303 -o "$RUNNER_TEMP/prores-sample.mov"
          https://probelibrary.s3.amazonaws.com/samples/V-codecs/HCPA/AppleProRes422.mov
      - name: Tests
        run: cargo test --release --test sample -- --nocapture
        env:
          PRORES_SAMPLE: ${{ runner.temp }}/prores-sample.mov
      - name: Tests (scalar kernels forced)
        run: cargo test --release --test sample -- --nocapture
        env:
          PRORES_SAMPLE: ${{ runner.temp }}/prores-sample.mov
          PRORES_FORCE_SCALAR: "1"
      # The decoded pictures must not depend on the SIMD level or the
      # thread count: one hash for all four.
      - name: Same pictures at every SIMD level and thread count
        run: |
          cargo build --release --example bench
          b=target/release/examples/bench
          s="$RUNNER_TEMP/prores-sample.mov"
          {
            $b file "$s" 1
            $b file "$s" 0
            PRORES_FORCE_SCALAR=1 $b file "$s" 1
            PRORES_FORCE_SCALAR=1 $b file "$s" 0
          } | tee hashes.txt
          test "$(cut -d' ' -f5 hashes.txt | sort -u | wc -l)" = 1

  msrv:
    name: MSRV (1.99)
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  lint:
    name: clippy and rustdoc
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: clippy for aarch64 (the NEON kernels)
        run: cargo clippy --all-targets --all-features --target aarch64-unknown-linux-gnu -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
